name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if Cargo.toml's version is already tagged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Every push to `main` is a release: `main` only advances via the develop->main
  # release PR (the gate). This workflow reads the version from Cargo.toml and
  # releases it unless that tag already exists. There is no tag-push trigger, so
  # no PAT / App token is needed — the provenance tag `vX.Y.Z` is created inside
  # the run by the `release` job using the default GITHUB_TOKEN (nothing is
  # *triggered* by it, so the token's recursion suppression does not matter).
  # Manual re-release: run via workflow_dispatch with `force: true`.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced release of ${TAG}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${TAG}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            lib_ext: dylib
          - target: x86_64-apple-darwin
            os: macos-latest
            lib_ext: dylib
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib_ext: so
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            lib_ext: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            lib_ext: so
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build cdylib (native)
        if: ${{ !matrix.cross && !matrix.musl }}
        run: cargo build --release --target ${{ matrix.target }} -p libbeachcomber-ffi

      - name: Build cdylib (musl)
        if: matrix.musl
        # musl defaults to a static CRT, which suppresses cdylib output;
        # the shared library needs a dynamic CRT (the binary build above
        # stays fully static).
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build --release --target ${{ matrix.target }} -p libbeachcomber-ffi

      - name: Build cdylib (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p libbeachcomber-ffi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../beachcomber-${{ needs.gate.outputs.tag }}-${{ matrix.target }}.tar.gz comb libbeachcomber.${{ matrix.lib_ext }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beachcomber-${{ matrix.target }}
          path: beachcomber-*.tar.gz

  c-sdk-tarball:
    name: Package C SDK
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create C SDK tarball
        run: |
          # The header comes from libbeachcomber-ffi/include: sdks/c's own
          # beachcomber.h is a repo-relative passthrough that only resolves
          # inside a checkout; an installed header must be self-contained.
          cp libbeachcomber-ffi/include/beachcomber.h sdks/c/beachcomber.h
          tar czf beachcomber-c-sdk-${{ needs.gate.outputs.tag }}.tar.gz \
            -C sdks/c \
            beachcomber.h Makefile libbeachcomber.pc.in README.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beachcomber-c-sdk
          path: beachcomber-c-sdk-*.tar.gz

  package-csdk:
    name: Package C SDK (${{ matrix.format }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: deb
          - format: rpm
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${{ needs.gate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build deb
        if: matrix.format == 'deb'
        run: bash packaging/deb-csdk/build.sh "${{ steps.version.outputs.version }}"

      - name: Build rpm
        if: matrix.format == 'rpm'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          bash packaging/rpm-csdk/build.sh "${{ steps.version.outputs.version }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: libbeachcomber-${{ matrix.format }}
          path: |
            *.deb
            *.rpm

  test-csdk-packages:
    name: Test C SDK ${{ matrix.distro }} package
    needs: package-csdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: ubuntu
            format: deb
            image: ubuntu:latest
          - distro: fedora
            format: rpm
            image: fedora:latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: libbeachcomber-${{ matrix.format }}
          path: pkg

      - name: Test install and pkg-config
        run: |
          docker run --rm -v ${{ github.workspace }}/pkg:/pkg ${{ matrix.image }} bash -c '
            if [ "${{ matrix.format }}" = "deb" ]; then
              apt-get update && apt-get install -y pkg-config
              dpkg -i /pkg/*.deb
            else
              dnf install -y pkg-config
              rpm -i /pkg/*.rpm
            fi
            pkg-config --exists libbeachcomber
            pkg-config --cflags libbeachcomber
            pkg-config --libs libbeachcomber
            test -f /usr/include/beachcomber.h
            test -f /usr/lib/pkgconfig/libbeachcomber.pc
            echo "All checks passed"
          '

  package-linux:
    name: Package Linux (${{ matrix.format }}-${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: deb
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - format: rpm
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - format: deb
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - format: rpm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: beachcomber-${{ matrix.target }}

      - name: Extract binary
        run: |
          mkdir -p target/${{ matrix.target }}/release
          tar xzf beachcomber-*.tar.gz -C target/${{ matrix.target }}/release

      - name: Build deb
        if: matrix.format == 'deb'
        run: |
          cargo install cargo-deb
          cargo deb --no-build --target ${{ matrix.target }}

      - name: Build rpm
        if: matrix.format == 'rpm'
        run: |
          cargo install cargo-generate-rpm
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: beachcomber-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm

  test-packages:
    name: Test ${{ matrix.distro }} package
    needs: package-linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: ubuntu
            format: deb
            image: ubuntu:latest
          - distro: fedora
            format: rpm
            image: fedora:latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: beachcomber-${{ matrix.format }}-x86_64
          path: pkg

      - name: Test install in container
        run: |
          docker run --rm -v ${{ github.workspace }}/pkg:/pkg ${{ matrix.image }} \
            bash -c 'pkg_file=$(find /pkg -name "*.${{ matrix.format }}" -type f); echo "Installing $pkg_file"; if [ "${{ matrix.format }}" = "deb" ]; then dpkg -i "$pkg_file"; else rpm -i "$pkg_file"; fi && comb --version'

  release:
    name: Create Release
    needs: [gate, build, c-sdk-tarball, package-linux, test-packages, test-csdk-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Triggered on push to main (not a tag), so name the tag explicitly;
          # the action creates `vX.Y.Z` on this commit with GITHUB_TOKEN.
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            beachcomber-*.tar.gz
            **/*.deb
            **/*.rpm

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - name: Publish libbeachcomber
        run: cargo publish -p libbeachcomber || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Publish beachcomber
        run: cargo publish -p beachcomber || echo "Already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: pip install build && python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          skip-existing: true

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Publish
        run: unset NODE_AUTH_TOKEN && npm publish --access public --provenance || echo "Already published, skipping"

  publish-rubygems:
    name: Publish to RubyGems
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build gem
        run: gem build libbeachcomber.gemspec
      - uses: rubygems/configure-rubygems-credentials@main
      - name: Publish
        run: gem push libbeachcomber-*.gem || echo "Already published, skipping"

  publish-luarocks:
    name: Publish to LuaRocks
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/lua
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install JSON library
        run: luarocks install dkjson
      - name: Publish
        run: luarocks upload --skip-pack rockspec/libbeachcomber-0.9.1-1.rockspec --api-key=${{ secrets.LUAROCKS_API_KEY }} || echo "Already published, skipping"

  publish-go:
    name: Tag Go module
    needs: [gate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Go module tag
        run: |
          git tag sdks/go/${{ needs.gate.outputs.tag }} || echo "Tag already exists, skipping"
          git push origin sdks/go/${{ needs.gate.outputs.tag }} || echo "Tag already pushed, skipping"

  publish-homebrew:
    name: Update Homebrew tap
    needs: [gate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NavistAu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: beachcomber-*-apple-darwin
          merge-multiple: true
          path: artifacts

      - name: Generate formula
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          ARM_SHA=$(shasum -a 256 artifacts/beachcomber-${{ needs.gate.outputs.tag }}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          INTEL_SHA=$(shasum -a 256 artifacts/beachcomber-${{ needs.gate.outputs.tag }}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)

          cat > homebrew-tap/Formula/beachcomber.rb << FORMULA
          class Beachcomber < Formula
            desc "Daemon that caches shell environment state for instant prompt rendering"
            homepage "https://github.com/NavistAu/beachcomber"
            version "${VERSION}"
            license "MIT"

            if Hardware::CPU.arm?
              url "https://github.com/NavistAu/beachcomber/releases/download/${{ needs.gate.outputs.tag }}/beachcomber-${{ needs.gate.outputs.tag }}-aarch64-apple-darwin.tar.gz"
              sha256 "${ARM_SHA}"
            else
              url "https://github.com/NavistAu/beachcomber/releases/download/${{ needs.gate.outputs.tag }}/beachcomber-${{ needs.gate.outputs.tag }}-x86_64-apple-darwin.tar.gz"
              sha256 "${INTEL_SHA}"
            end

            def install
              bin.install "comb"
              lib.install "libbeachcomber.dylib"
            end

            test do
              assert_match "beachcomber", shell_output("#{bin}/comb --version")
            end
          end
          FORMULA

      - name: Push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/beachcomber.rb
          git commit -m "beachcomber ${{ needs.gate.outputs.tag }}"
          git push

  publish-npm-binary:
    name: Publish beachcomber binary installer to npm
    needs: [gate, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
    defaults:
      run:
        working-directory: placeholders/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.gate.outputs.version }}"
      - name: Publish
        run: unset NODE_AUTH_TOKEN && npm publish --access public --provenance || echo "Already published, skipping"

  publish-pypi-binary:
    name: Publish beachcomber binary installer to PyPI
    needs: [gate, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: placeholders/pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set version
        run: sed -i "s/^version = .*/version = \"${{ needs.gate.outputs.version }}\"/" pyproject.toml
      - name: Build
        run: pip install build && python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: placeholders/pypi/dist/
          skip-existing: true
