# Config for generating `include/beachcomber.h` from this crate's `extern "C"`
# surface. Regenerate with `cargo xtask gen-header`; CI's freshness check runs
# `cargo xtask gen-header --check` and fails if the committed header drifts.
#
# cbindgen is intentionally NOT a build-dependency of this crate (see
# libbeachcomber-ffi/README or the xtask module doc) — install it with
# `cargo install cbindgen --locked` to regenerate locally.

language = "C"
header = "/* Generated by cbindgen from libbeachcomber-ffi. Do not edit by hand — run `cargo xtask gen-header`. */"
include_guard = "BEACHCOMBER_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't manually edit this file. */"
style = "type"
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true
