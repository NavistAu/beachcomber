# cargo-nextest configuration.
# Docs: https://nexte.st/docs/configuration/reference/

[profile.default]
# Hard cap on total suite wall-clock. If the run exceeds this, nextest sends
# SIGTERM to the test process group, waits 10s for shutdown, then SIGKILLs.
# The whole run fails spectacularly — which is what we want.
#
# 10s is the ENFORCED performance budget, per CLAUDE.md: a suite that cannot
# finish in 10s is a failure that must be investigated, not accommodated.
# Raising this value is not a fix and needs explicit owner sign-off (the
# 2026-08-29 bump to 90s was unauthorised and was reverted 2026-09-22; the
# budget went 30s -> 10s on 2026-11-09, the suite then ~9s at load 30-70).
global-timeout = "10s"

# Per-test slow detection and termination. Any single test exceeding the period
# is reported as SLOW; after terminate-after periods it's hard-killed.
# 15s reported, 30s killed. No single test should legitimately take that long
# (the current slow outliers are documented separately; see scheduler_timeout
# and demand tests).
slow-timeout = { period = "15s", terminate-after = 2 }

# Treat leaky tests (subprocesses that outlive the test) as failures rather
# than warnings. { period, result } syntax available since nextest 0.9.76;
# running 0.9.132 here.
# Period bumped 100ms → 250ms (2026-04-27) then → 1s (2026-05-29) after the
# LEAK-FAIL recurred on the Coverage gate, where llvm-cov instrumentation makes
# TempDir teardown + Arc drop ordering several times slower than a plain build.
# No real subprocesses leak here — a genuinely leaked daemon runs indefinitely
# and is still caught at 1s — so this only removes the spurious instrumented-run
# flake. If it recurs at 1s, investigate what is actually outliving the test.
# (One cause found: on macOS a test spawned alongside another inherited its
# output pipes; `tests/suite/main.rs` closes them at startup.)
leak-timeout = { period = "1s", result = "fail" }

# Three tests per core: a test spends about half its time waiting on the
# processes it runs (`comb`, `git`), so one per core leaves cores idle, and
# on a machine busy with other work more threads hold a fairer share of it.
# Measured on an M2 Max (12 cores) at load 30-50: 12 threads ~11.5s, 24
# ~10s, 36 ~9.5s, 48 no better. CI keeps one per core (below).
test-threads = 36

# --- No test groups ---
# No group caps the suite's parallelism: every test has its own socket,
# `$HOME` and config directory (`IsolatedSocket`, `common::daemon::isolate`),
# so the tests that start daemons share nothing to collide on.

# --- Retries for environment-sensitive tests ---
# watcher_*, uptime_*, and battery_* depend on OS-level subsystems that can
# legitimately flake. Two retries with exponential backoff give them a chance
# to succeed on a quiet machine without hiding real regressions.
[[profile.default.overrides]]
filter = 'test(watcher_) + test(uptime_) + test(battery_)'
retries = { backoff = "exponential", count = 2, delay = "1s", jitter = true }

# ---------------------------------------------------------------------------
# CI profile — inherits everything from default, overrides what differs.
# ---------------------------------------------------------------------------
[profile.ci]
# Longer global timeout for CI machines that may be slower than laptops.
# Cold builds (cargo + llvm-cov instrumented compile) take 3-4 min alone;
# 10m ensures the suite can complete on a fresh cache without hitting the wall.
global-timeout = "10m"
# Keep the same per-test limits as default.
slow-timeout = { period = "15s", terminate-after = 2 }
# Never stop the suite early on a single failure — collect all results.
fail-fast = false
# A CI runner's few cores, one test each: the timing assertions are sized for it.
test-threads = "num-cpus"

[profile.ci.junit]
path = "target/nextest/junit.xml"

# --- The long tests start first ---
# The suite's wall time is its work spread over the cores; a multi-second test
# that starts last runs on alone past the rest. These are the longest (each a
# repository driven through many git commands).
[[profile.default.overrides]]
filter = 'test(/^shipped::git::/) + test(/^validity::/) + test(/^cli_ffi_equivalence::/) + test(/^provider_conformance::/)'
priority = 100
