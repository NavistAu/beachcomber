[daemon.providers.kerberos]
# On only where `klist` is on the daemon's PATH; the templates below run in your shell.
enabled.template = "{{ 'klist' | which }}"

[client.providers.kerberos]
# The shell's credential cache ($KRB5CCNAME), asked once per read: the exit status is `klist -s`'s (MIT's silent flag, Heimdal's alias of `--test`), the output plain `klist`'s. Memoised on the cache name, for 30 seconds.
var.klist = "{{ 'klist -s; s=$?; klist 2>/dev/null; exit $s' | ttl('30s') | cache(env.KRB5CCNAME) | execa(ok=[0, 1, 2]) }}"

[client.providers.kerberos.template]
# Whether the cache holds a valid ticket.
ticket = "{{ klist.exit_code == 0 }}"
# The cache's principal: MIT's `Default principal: …`, Heimdal's `Principal: …`; absent when the cache holds none.
principal = "{{ (klist.stdout | regex_search('(?m)^\\\\s*(?:Default p|P)rincipal:\\\\s*(\\\\S+)') or [none, none])[1] }}"
