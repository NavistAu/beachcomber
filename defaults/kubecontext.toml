[client.providers.kubecontext]
# The kubectl context in effect, honouring the shell's own $KUBECONFIG.
template.context = "{{ exec('kubectl config current-context') }}"
# The context's namespace; `default` when it sets none.
template.namespace = "{{ exec(['kubectl', 'config', 'view', '--minify', '-o', 'jsonpath={..namespace}']) or 'default' }}"
