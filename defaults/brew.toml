# Homebrew's outdated formulae and casks, from what it already knows: nothing is fetched. brew would otherwise update
# itself first (a network fetch) before `outdated`, so the command sets HOMEBREW_NO_AUTO_UPDATE. Off where `brew` is not on
# the daemon's PATH. The lists are refreshed by `brew update`, which is the opt-in `brew.update` Source (shipped off).
[daemon.providers.brew]
enabled.template = "{{ 'brew' | which }}"

[daemon.providers.brew.sources.outdated]
# Outdated package names, their number, and when brew last updated its lists (the mtime of its repository's `.git/FETCH_HEAD`, which `brew update` touches). Polled hourly; also run when FETCH_HEAD changes (an update finished).
data = "{{ (_.exec('HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ENV_HINTS=1 brew outdated --quiet', timeout='60s') or '') | split('\\n') | select | list | tojson }}"
result.packages = "{{ data | fromjson }}"
result.count = "{{ data | fromjson | length }}"
result.checked = '''{% set f = (_.exec('brew --repository') ~ '/.git/FETCH_HEAD') | stat %}{{ f.mtime | int if f }}'''
return = "{{ result | poll('1h', 2) | watch('/opt/homebrew/.git/FETCH_HEAD', '/usr/local/Homebrew/.git/FETCH_HEAD', '/home/linuxbrew/.linuxbrew/Homebrew/.git/FETCH_HEAD') | failback('10m', 3) }}"

# Opt-in: refreshes brew's lists daily (`brew update`: a network fetch, no sudo). Off until you turn it on:
#   [daemon.providers.brew.sources.update]
#   enabled = true
[daemon.providers.brew.sources.update]
# When `brew update` last ran here. `brew.checked` follows it.
enabled = false
data = "{{ _.exec('brew update --quiet', timeout='5m') or '' }}"
result.at = "{{ _.now() }}"
return = "{{ result | poll('24h', 1) | failback('1h', 3) }}"
