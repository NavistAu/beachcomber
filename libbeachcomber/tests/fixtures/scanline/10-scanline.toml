# Generated by scanline; do not edit. Override a leaf in a later drop-in
# (e.g. conf.d/20-mine.toml): a leaf two files set is read from the later
# file, so an override names only the leaf it changes.
#
# Inputs: scanline puts its per-render facts under `scanline.*` and passes
# each widget's solved width as env.SCANLINE_WIDTH, with the terminal's TERM
# and COLORTERM (they set the colour depth). Everything else here is
# configuration.

# ─── Daemon: git worktree name ───────────────────────────────────────────────
# comb's git provider has no `worktree` field. A linked worktree's `.git` is a
# file, `gitdir: <main>/.git/worktrees/<name>`; this reads it. A few stats and
# one small read per run, no process. The name never changes for a root, so a
# slow poll, not a watch on the busy `.git` directory.
[daemon.providers.gitstats.sources.worktree]
root = "{{ lup('.git') | dirname }}"
data = "{{ (lup('.git', files=true) | read) if lup('.git', files=true) == lup('.git') }}"
result.worktree = "{% set m = data | regex_search('/worktrees/([^/\\s]+)') %}{{ m[1] if m }}"
return = "{{ result | poll('10m') | nearest }}"

# ─── Daemon: the Claude status page ──────────────────────────────────────────
# Fetched once for every session and client, on the daemon's schedule. `status`
# is {component id: status}; `incidents` is [{impact, start, end}] in epoch
# seconds, parsed here once per poll rather than in every render.
[daemon.providers.claude_status.sources.summary]
data = "{{ url('https://status.claude.com/api/v2/summary.json', timeout='5s') | fromjson }}"
result.status = '''
{%- set ns = namespace(m={}) -%}
{%- for c in data.components -%}
    {%- set ns.m = ns.m | merge({c.id: c.status}) -%}
{%- endfor -%}
{{- ns.m -}}
'''
return = "{{ result | poll('60s') | failback('30s', 3) }}"

[daemon.providers.claude_status.sources.incidents]
data = "{{ url('https://status.claude.com/api/v2/incidents.json', timeout='5s') | fromjson }}"
result.incidents = '''
{%- set ns = namespace(out=[]) -%}
{%- for inc in data.incidents -%}
    {%- set ns.out = ns.out + [{"impact": inc.impact, "start": inc.created_at | fromiso, "end": inc.resolved_at | fromiso}] -%}
{%- endfor -%}
{{- ns.out -}}
'''
return = "{{ result | poll('15m') | failback('30s', 3) }}"

# ─── Client: the theme ───────────────────────────────────────────────────────
# From claude-scanline's [colors]. The session colour pair is per session and
# stays in the put (scanline.theme.session_color, .session_color_dim); a read
# of scanline.theme merges the two.
[client.providers.scanline.template.theme]
green = "#a6e22e"
yellow = "#e6db74"
orange = "#fd971f"
red = "#f92672"
blue = "#66d9ef"
purple = "#ae81ff"
cyan = "#a1efe4"
dir = "#a0a090"
bar_empty = "#3e3d32"
bar_dark_fg = "#1a1a14"
bar_label_fg = "#ffffff"

# ─── Client: status-page constants ───────────────────────────────────────────
# Which components show, in order, and how; how an incident's impact ranks;
# the sparkline's glyph and theme colour per rank.
[client.providers.scanline.template.status_page]
components = '''{{ [
    {"id": "rwppv331jlwc", "icon": "●", "abbr": "WEB", "ch": "W"},
    {"id": "k8w3r06qmzrp", "icon": "◆", "abbr": "API", "ch": "A"},
    {"id": "yyzkbfz2thpt", "icon": "■", "abbr": "CLI", "ch": "C"}
] }}'''
rank = '{{ {"minor": 1, "major": 2, "critical": 3} }}'
spark = '{{ [["▁", "green"], ["▃", "yellow"], ["▅", "orange"], ["█", "red"]] }}'

# A component status's theme colour; anything else is green.
[client.providers.scanline.template.status_page.colour]
operational = "green"
degraded_performance = "yellow"
partial_outage = "orange"
major_outage = "red"

# ─── Client: macros ──────────────────────────────────────────────────────────
# `usage` is a window's colour from its use against its elapsed share; `rate`
# paints the 5H and 7D rows. The label of each row's left bar moves left when
# either row's marker would hit it, so the two rows stay aligned.
[client.providers.scanline.macro]
usage = '''
{%- macro usage(p, tp, th) -%}
    {%- set band = ((100 - tp) / 100) | clamp(0, 1) -%}
    {%- set dev = p - tp -%}
    {{- th.green if ((dev | abs) < 10 * band) else ((th.orange if (dev < 20 * band) else th.red) if (dev > 0) else (th.cyan if (dev > (0 - 20 * band)) else th.purple)) -}}
{%- endmacro -%}
'''
rate = '''
{%- set w = env.SCANLINE_WIDTH | int -%}
{%- set th = scanline.theme -%}
{%- set win = scanline.calc.windows -%}
{%- set lw = ([0, w - 6] | max) // 2 -%}
{%- set rw = ([0, w - 6] | max) - lw -%}
{%- set hit = namespace(d={}) -%}
{%- for name in ["five_hour", "seven_day"] -%}
    {%- set x = win[name] -%}
    {%- set mk = (lw - ((x.time_pct / 100 * lw) | round | int)) | clamp(0, [0, lw - 1] | max) -%}
    {%- set pl = (("%.0f" | format(x.pct)) ~ "%") | width -%}
    {%- set st = [0, ([0, lw - 1] | max) - pl] | max -%}
    {%- set hit.d = hit.d | merge({name: (lw > 0) and (x.time_pct > 0) and (mk >= st) and (mk < (st + pl))}) -%}
{%- endfor -%}
{%- set either = hit.d.five_hour or hit.d.seven_day -%}
{%- set left = {"five_hour": either, "seven_day": hit.d.seven_day if scanline.rate.overage else either} -%}
{%- macro row(name, label) -%}
    {%- set x = win[name] -%}
    {%- set ps = ("%.0f" | format(x.pct)) ~ "%" -%}
    {%- set ltext = ((" " ~ (ps | pad(3, "right"))) | pad(lw)) if left[name] else ((ps ~ " ") | pad(lw, "right")) -%}
    {{- bar(w,
        {"value": x.pct / 100, "colour": x.colour, "from_right": true, "marker": (x.time_pct / 100) if (x.time_pct > 0) else none, "text": ltext},
        "  " ~ label ~ "  ",
        {"value": x.time_pct / 100, "colour": (100 - x.time_pct) | ramp([20, 50, 80], [th.green, th.yellow, th.orange, th.red]), "text": (" " ~ x.left_str) | pad(rw)},
        empty=th.bar_empty, fill_fg=th.bar_dark_fg, text_fg=th.bar_label_fg, label_fg=th.bar_label_fg, bold=true) -}}
{%- endmacro -%}
{%- macro overage() -%}
    {%- set x = win.five_hour -%}
    {%- set ov = scanline.rate.overage_amount -%}
    {%- set amount = ("$" ~ ("%.2f" | format(ov.value | float)) ~ ov.currency) if ov else "" -%}
    {%- set lbl = (" OVER: " ~ amount ~ " ") if (ov and (ov.kind == "balance")) else ((" OVER: " ~ amount ~ " spent ") if (ov and (ov.kind == "spent")) else " OVER ") -%}
    {%- set elapsed = ((18000 - ([x.left, 18000] | min)) / 18000) | clamp(0, 1) -%}
    {{- bar(w, {"label": lbl, "fg": th.red, "bg": none},
        {"value": elapsed, "colour": th.green, "text": x.left_str | pad(w - (lbl | width), "center")},
        empty=th.bar_empty, fill_fg=th.bar_dark_fg, text_fg=th.bar_label_fg, bold=true) -}}
{%- endmacro -%}
'''

# ─── Client: derived values, shared by several widgets ───────────────────────
[client.providers.scanline.template.calc]

# The three usage windows: pct, seconds left, elapsed share of the window,
# whether it has a reset time, the usage colour and the time left as text.
windows = '''
{%- from "scanline:macro.usage" import usage -%}
{%- set th = scanline.theme -%}
{%- set r = scanline.rate -%}
{%- set q = comb.scanline.model.quota -%}
{%- set ns = namespace(d={}) -%}
{%- for name, win, pct, span in [["five_hour", r.five_hour, "used_pct", 18000], ["seven_day", r.seven_day, "used_pct", 604800], ["quota", q, "pct", 604800]] -%}
    {%- set p = (win[pct] | float) if win else 0.0 -%}
    {%- set resets = (win.resets_at if win else 0) if (name != "quota") else win.resets_at -%}
    {%- set timed = resets is number -%}
    {%- set left = ([0, ([0, resets] | max) - now()] | max) if timed else 0 -%}
    {%- set tp = ((span - ([left, span] | min)) / span * 100) if timed else 0 -%}
    {%- set ns.d = ns.d | merge({name: {"pct": p, "left": left, "time_pct": tp, "timed": timed, "colour": usage(p, tp, th), "left_str": left | duration(floor="m")}}) -%}
{%- endfor -%}
{{- ns.d -}}
'''

# ─── Client: the widgets ─────────────────────────────────────────────────────
# One template per <widget src="scanline.NAME">.
[client.providers.scanline.template]

context_bar = '''
{%- set w = env.SCANLINE_WIDTH | int -%}
{%- set th = scanline.theme -%}
{%- set p = scanline.context.used_pct | float -%}
{%- set col = p | ramp([50, 80], [th.green, th.orange, th.red]) -%}
{%- set label = ("%.0f" | format(p)) ~ "% " -%}
{%- set mcol = ([((65.0 / 100 * w) | int), w - 1] | min) if (w > 0) else w -%}
{%- set right_start = [0, w - (label | width)] | max -%}
{%- set collides = (mcol >= right_start) and (mcol < w) -%}
{%- set pstart = ([mcol - (label | width), 0] | max) if collides else right_start -%}
{%- set pend = mcol if collides else w -%}
{{- bar(w, {"value": p / 100, "colour": col, "marker": 0.65, "marker_round": "floor", "marker_char": "!", "marker_fg": th.red, "text": label[0:(pend - pstart)] | pad(pend, "right"), "text_fg": col}, empty=th.bar_empty, fill_fg=th.bar_dark_fg, bold=true) -}}
'''

model = '''
{%- set w = env.SCANLINE_WIDTH | int -%}
{%- set th = scanline.theme -%}
{%- set m = comb.scanline.model -%}
{%- set sess = scanline.session -%}
{%- if m.quota -%}
    {%- set q = scanline.calc.windows.quota -%}
    {%- set p = q.pct -%}
    {%- set col = q.colour if q.timed else (p | ramp([50, 80], [th.green, th.orange, th.red])) -%}
    {%- set hasmk = q.timed and (q.time_pct > 0) -%}
    {%- set ps = ("%.0f" | format(p)) ~ "%" -%}
    {%- set budget = [0, w - ((ps | width) + 3)] | max -%}
    {%- set nm = m.short | truncate(budget, end="") -%}
    {%- set spok = (m.fast or m.thinking) and (((nm | width) + 1) <= budget) -%}
    {%- set nm = (nm ~ " ") if spok else nm -%}
    {%- set ff = m.fast and spok and (((nm | width) + 2) <= budget) -%}
    {%- set nm = (nm ~ "⚡") if ff else nm -%}
    {%- set tf = m.thinking and spok and ((not m.fast) or ff) and (((nm | width) + 2) <= budget) -%}
    {%- set nm = (nm ~ "💭") if tf else nm -%}
    {%- set mk = [((q.time_pct / 100 * w) | round | int), ([0, w - 1] | max)] | min -%}
    {%- set rstart = [0, w - ((ps | width) + 1)] | max -%}
    {%- set pstart = ([(nm | width) + 2, rstart] | min) if (hasmk and (mk >= rstart) and (mk < (rstart + (ps | width)))) else rstart -%}
    {{- bar(w, {"value": p / 100, "colour": col, "marker": (q.time_pct / 100) if hasmk else none, "text": ((" " ~ nm) | pad(pstart)) ~ ps, "text_fg": th.bar_label_fg}, empty=th.bar_empty, fill_fg=th.bar_dark_fg, bold=true) -}}
{%- else -%}
    {%- set name = m.short ~ ((" " ~ ("⚡" if m.fast else "") ~ ("💭" if m.thinking else "")) if (m.fast or m.thinking) else "") -%}
    {%- set tag = (" ·" ~ m.effort) if (m.effort and (m.effort != "medium")) else "" -%}
    {{- name ~ (tag | dim) ~ ((" " ~ (sess.agent | truncate(8))) if sess.agent else "") ~ (" " if sess.name else "") ~ (sess.name | bold) -}}
{%- endif -%}
'''

rate_5h = '''
{%- from "scanline:macro.rate" import row, overage -%}
{{- overage() if scanline.rate.overage else row("five_hour", "5H") -}}
'''

rate_7d = '''
{%- from "scanline:macro.rate" import row -%}
{{- row("seven_day", "7D") -}}
'''

git_changes = '''
{%- set th = scanline.theme -%}
{%- set g = git -%}
{%- set la = g.lines_added | default(0) -%}
{%- set lr = g.lines_removed | default(0) -%}
{%- set fc = (g.staged | default(0)) + (g.unstaged | default(0)) -%}
{%- set show = (g.dirty | default(false)) or (la > 0) or (lr > 0) -%}
{%- set stats = show and ((la > 0) or (lr > 0) or (fc > 0)) -%}
{%- set da = g.lines_added_parent | default(0) | int -%}
{%- set dr = g.lines_removed_parent | default(0) | int -%}
{%- set showdelta = (not show) and ((da > 0) or (dr > 0)) -%}
{{- (("● " if show else "") | fg(th.yellow)) ~ ((("+" ~ la ~ "/" ~ fc) if stats else "") | fg(th.green)) ~ (" " if stats else "") ~ ((("-" ~ lr ~ "/" ~ fc) if stats else "") | fg(th.red)) ~ (((" ") if showdelta else "") | fg(th.blue)) ~ ((("+" ~ da) if showdelta else "") | fg(th.green)) ~ (" " if showdelta else "") ~ ((("-" ~ dr) if showdelta else "") | fg(th.red)) -}}
'''

git_branch = '''
{%- set th = scanline.theme -%}
{%- set g = git -%}
{%- set wt = gitstats.worktree | default("") -%}
{%- set br = g.branch | default("") -%}
{%- set ahead = g.ahead | default(0) -%}
{%- set behind = g.behind | default(0) -%}
{%- set bp = g.branch_parent | default("") -%}
{%- if br -%}
    {%- set inb = (wt != "") and (wt in br) -%}
    {%- set parts = (br | split(wt, 1) | list) if inb else [] -%}
    {%- set pre = parts[0] if inb else br -%}
    {%- set post = (parts[1] if ((parts | length) > 1) else "") if inb else "" -%}
    {%- set tail = (wt != "") and (not inb) -%}
    {%- set showp = (bp != "") and (bp != br) -%}
    {{- ("" | fg(th.purple)) ~ (("⌥" if (wt != "") else "") | fg(th.cyan)) ~ (" " if (wt == "") else "") ~ (pre | fg(th.purple)) ~ ((wt if inb else "") | fg(th.cyan)) ~ (post | fg(th.purple)) ~ ((" +" ~ ahead ~ "↑") if (ahead > 0) else "") ~ ((" -" ~ behind ~ "↓") if (behind > 0) else "") ~ (" " if tail else "") ~ ((wt if tail else "") | fg(th.cyan)) ~ (((" (" ~ bp ~ ")") if showp else "") | fg(th.blue)) -}}
{%- elif wt != "" -%}
    {{- (("⌥" ~ wt) | fg(th.cyan)) -}}
{%- endif -%}
'''

claude_changes = '''
{%- set ws = scanline.workspace -%}
{%- set th = scanline.theme -%}
{%- set stats = (ws.lines_added > 0) or (ws.lines_removed > 0) -%}
{%- set tool = ws.active_tool -%}
{%- set ag = ws.running_agents > 0 -%}
{%- set sp = spinner("◐◓◑◒") -%}
{{- ("✎ " if (stats or tool or ag) else "") ~ ((("+" ~ ws.lines_added) if stats else "") | fg(th.green)) ~ (" " if stats else "") ~ ((("-" ~ ws.lines_removed) if stats else "") | fg(th.red)) ~ (" " if (tool and stats) else "") ~ (((sp ~ " " ~ tool) if tool else "") | fg(th.blue)) ~ (" " if (ag and (stats or tool)) else "") ~ (("⏳" ~ ws.running_agents) if ag else "") -}}
'''

cwd = '''
{%- set w = env.SCANLINE_WIDTH | int -%}
{%- set ws = scanline.workspace -%}
{%- set th = scanline.theme -%}
{%- set sd = ws.subdir -%}
{%- set parts = (sd | split("/") | reject("eq", "") | list) if sd else [] -%}
{%- set n = parts | length -%}
{%- set short = (parts | join("/")) if (n <= 2) else ("…/" ~ parts[n - 2] ~ "/" ~ parts[n - 1]) -%}
{%- set fits = ((ws.path_full ~ (("/" ~ sd) if sd else "")) | width) <= w -%}
{{- ((ws.path_full if fits else ws.path) | fg(th.dir)) ~ ((("/" ~ (sd if fits else short)) if sd else "") | fg(th.cyan if ws.in_worktree else th.dir) | dim) -}}
'''

api_sparkline = '''
{%- set w = env.SCANLINE_WIDTH | int -%}
{%- set th = scanline.theme -%}
{%- set k = scanline.status_page -%}
{%- set t = now() -%}
{%- set start = t - (w * 3600) -%}
{%- set ns = namespace(ev=[]) -%}
{%- if w > 0 -%}
    {%- for inc in claude_status.incidents -%}
        {%- set rank = k.rank[inc.impact] | default(0) -%}
        {%- set sb = [inc.start | default(t), start] | max -%}
        {%- set eb = [inc.end | default(t), t] | min -%}
        {%- if (rank > 0) and (sb <= eb) -%}
            {%- set ns.ev = ns.ev + [[rank, ((sb - start) // 3600), ([((eb - start) // 3600), w - 1] | min)]] -%}
        {%- endif -%}
    {%- endfor -%}
{%- endif -%}
{%- set out = namespace(s="") -%}
{%- for i in range(w) -%}
    {%- set b = namespace(r=0) -%}
    {%- for e in ns.ev -%}
        {%- if (e[0] > b.r) and (i >= e[1]) and (i <= e[2]) -%}{%- set b.r = e[0] -%}{%- endif -%}
    {%- endfor -%}
    {%- set out.s = out.s ~ (k.spark[b.r][0] | fg(th[k.spark[b.r][1]])) -%}
{%- endfor -%}
{{- out.s -}}
'''

api_status = '''
{%- set w = env.SCANLINE_WIDTH | int -%}
{%- set th = scanline.theme -%}
{%- set k = scanline.status_page -%}
{%- set st = claude_status.status -%}
{%- set ns = namespace(s="", n=0) -%}
{%- for c in k.components -%}
    {%- if st[c.id] is defined -%}
        {%- set ns.s = ns.s ~ ((("  " ~ c.icon ~ c.abbr ~ "  ") if (w >= 24) else (" " ~ c.ch)) | fg(th.bar_dark_fg) | bg(th[k.colour[st[c.id]] | default("green")]) | bold) -%}
        {%- set ns.n = ns.n + 1 -%}
    {%- endif -%}
{%- endfor -%}
{{- ns.s ~ (" " if ((w < 24) and (ns.n > 0)) else "") -}}
'''

cache_hit = '''
{%- set th = scanline.theme -%}
{%- set c = scanline.cache -%}
{%- set hp = (c.hit_pct | float) if (c.hit_pct is number) else 0.0 -%}
{%- set col = hp | ramp([50, 80], [th.red, th.orange, th.green]) -%}
{{- (("▹" if (c.hit_pct is number) else "") | dim) ~ (((("%.0f" | format(hp)) ~ "%") if (c.hit_pct is number) else "") | fg(col)) -}}
'''

cache_churn = '''
{%- set c = scanline.cache -%}
{%- set chn = (c.churn | int) if (c.churn is number) else 0 -%}
{%- set abbr = (("%.1f" | format(chn / 1000000.0)) ~ "M") if (chn >= 1000000) else ((("%.1f" | format(chn / 1000.0)) ~ "k") if (chn >= 1000) else (chn ~ "")) -%}
{{- ((("+" ~ abbr) if (c.churn is number) else "") | dim) -}}
'''
