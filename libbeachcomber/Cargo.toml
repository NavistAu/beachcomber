[package]
name = "libbeachcomber"
version = "0.9.1"
edition = "2024"
description = "Client library for querying the beachcomber (comb) shell state daemon"
license = "MIT"
repository = "https://github.com/NavistAu/beachcomber"
keywords = ["shell", "prompt", "git", "daemon", "client"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
minijinja = { workspace = true }
rust-ini = "0.21.3"
liblup = "0.3"
unicode-width = "0.2"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11"
crc32fast = "1.5"
base64 = "0.22"

[dev-dependencies]
beachcomber = { path = "..", features = ["test-helpers"] }
tempfile = "3"
temp-env = "0.3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
