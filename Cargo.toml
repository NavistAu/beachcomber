[workspace]
members = [".", "libbeachcomber", "tests/fixtures/test_provider_lib", "xtask"]

[workspace.dependencies]
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

[package]
name = "beachcomber"
version = "0.7.0"
edition = "2024"
description = "A centralized daemon that caches shell state (git, battery, hostname, etc.) so every consumer reads from one fast cache instead of independently forking shells"
license = "MIT"
repository = "https://github.com/NavistAu/beachcomber"
homepage = "https://github.com/NavistAu/beachcomber"
keywords = ["shell", "prompt", "git", "tmux", "daemon"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "beachcomber"
path = "src/lib.rs"

[[bin]]
name = "comb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
xdg = "3"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
notify = "8"
tokio-util = "0.7"
ureq = "3"
libloading = "0.9.0"
minijinja = { workspace = true }
terminal_size = "0.3"
thiserror = "2.0.18"
sha2 = "0.11.0"
libbeachcomber = { path = "libbeachcomber", version = "0.7.0" }

[features]
test-helpers = []

[dev-dependencies]
beachcomber = { path = ".", features = ["test-helpers"] }
tempfile = "3"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
ctor = "0.4"
walkdir = "2"
pretty_assertions = "1"
assert_cmd = "2"
predicates = "3"
mockall = "0.13"
temp-env = "0.3"
mockito = "1"

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "providers"
harness = false

[[bench]]
name = "socket"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "prompt_race"
harness = false

[[bench]]
name = "cli"
harness = false

[profile.dev]
# macOS: skip dsymutil during link (keep debug info in .o files). Faster link.
split-debuginfo = "unpacked"
# Keep backtraces with file:line, drop variable inspection info. Much smaller
# debug data, faster link. Trade-off: less info in `lldb` step-through sessions.
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = true
strip = true

[package.metadata.deb]
maintainer = "NavistAu <github@navistau.io>"
copyright = "2026, NavistAu"
extended-description = "A centralized daemon that caches shell state (git, battery, network, etc.) so every consumer reads from one fast cache instead of independently forking shells."
section = "utils"
priority = "optional"
assets = [
    ["target/release/comb", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/comb", dest = "/usr/bin/comb", mode = "0755" },
]
